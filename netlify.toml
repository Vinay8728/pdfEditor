# Netlify configuration for pdfEditor
# Next.js is built with `output: 'export'`, so Netlify serves plain static files
# from `out/`. Do NOT add @netlify/plugin-nextjs — it conflicts with static export.

[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"

# Serverless conversion endpoint (Phase 2 Office formats)
[[redirects]]
  from = "/api/convert"
  to = "/.netlify/functions/convert"
  status = 200
  force = true

# SPA-ish fallback for the exported site
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# pdf.js + Tesseract need cross-origin isolation-friendly headers and
# permissive worker/wasm loading. Everything below is client-side only.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/pdf.worker.min.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
