name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # This project has no committed lockfile, because it was authored on a
      # machine without Node. CI publishes the one it resolves so it can be
      # downloaded and committed, making later builds reproducible.
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 30
          if-no-files-found: ignore

      # Build runs first: it generates next-env.d.ts, which the standalone
      # typecheck needs in order to resolve Next's ambient module declarations.
      - name: Build static export
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== BUILD =====" > ci-report.txt
          npm run build 2>&1 | tee -a ci-report.txt

      - name: Typecheck
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          echo "" >> ci-report.txt
          echo "===== TYPECHECK =====" >> ci-report.txt
          npm run typecheck 2>&1 | tee -a ci-report.txt

      - name: Install browser
        if: steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium

      # Drives the real static export in a real browser: pdf.js worker, pdf-lib,
      # canvas and downloads, asserting on the bytes that come back out.
      - name: End-to-end tests
        id: e2e
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "" >> ci-report.txt
          echo "===== E2E =====" >> ci-report.txt
          npm run test:e2e 2>&1 | tee -a ci-report.txt

      - name: Verify export output
        if: always()
        run: |
          {
            echo ""
            echo "===== EXPORT ====="
            test -f out/index.html && echo "out/index.html OK" || echo "MISSING out/index.html"
            test -f out/pdf.worker.min.mjs && echo "pdf worker OK" || echo "MISSING pdf worker"
            echo "HTML pages: $(find out -name '*.html' 2>/dev/null | wc -l)"
          } >> ci-report.txt

      - name: Upload test report
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # On failure the full output is pushed to its own branch, so it can be read
      # over plain HTTPS without an authenticated log download. Successful runs
      # leave no trace.
      - name: Publish failure report
        if: steps.build.outcome == 'failure' || steps.tsc.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          cp ci-report.txt "$RUNNER_TEMP/ci-report.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-report
          git reset --hard
          cp "$RUNNER_TEMP/ci-report.txt" ci-report.txt
          git add -f ci-report.txt
          git commit -m "CI report for ${GITHUB_SHA::7}"
          git push -f origin ci-report

      - name: Fail if anything broke
        if: steps.build.outcome == 'failure' || steps.tsc.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "::error::build, typecheck or e2e failed — see the ci-report branch"
          exit 1
