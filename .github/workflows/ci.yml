name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/index.html || (echo "::error::static export missing out/index.html" && exit 1)
          test -f out/pdf.worker.min.mjs || (echo "::error::pdf.js worker not copied into export" && exit 1)
          echo "Export OK — $(find out -name '*.html' | wc -l) HTML pages"
