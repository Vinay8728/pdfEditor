name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Build runs first: it generates next-env.d.ts, which the standalone
      # typecheck needs in order to resolve Next's ambient module declarations.
      - name: Build static export
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== BUILD =====" > ci-report.txt
          npm run build 2>&1 | tee -a ci-report.txt

      - name: Typecheck
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          echo "" >> ci-report.txt
          echo "===== TYPECHECK =====" >> ci-report.txt
          npm run typecheck 2>&1 | tee -a ci-report.txt

      - name: Verify export output
        if: always()
        run: |
          {
            echo ""
            echo "===== EXPORT ====="
            test -f out/index.html && echo "out/index.html OK" || echo "MISSING out/index.html"
            test -f out/pdf.worker.min.mjs && echo "pdf worker OK" || echo "MISSING pdf worker"
            echo "HTML pages: $(find out -name '*.html' 2>/dev/null | wc -l)"
            find out -name '*.html' 2>/dev/null | sort | head -40
          } >> ci-report.txt

      # The report is published to its own branch so the full compiler output can
      # be read over plain HTTPS without an authenticated log download.
      - name: Publish report
        if: always()
        run: |
          cp ci-report.txt "$RUNNER_TEMP/ci-report.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-report
          git reset --hard
          cp "$RUNNER_TEMP/ci-report.txt" ci-report.txt
          git add -f ci-report.txt
          git commit -m "CI report for ${GITHUB_SHA::7}"
          git push -f origin ci-report

      - name: Fail if anything broke
        if: steps.tsc.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "::error::typecheck or build failed — see the ci-report branch"
          exit 1
